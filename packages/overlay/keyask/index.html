<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Key request</title>
<script src="rednode://ui/rednode-ui.js"></script>
<style>
  html, body { margin: 0; width: 540px; height: 330px; overflow: hidden; background: transparent; }
  rn-window { position: absolute; inset: 0; }
  p { margin: 0 0 10px; font-size: 15px; line-height: 1.45; }
  .dim { color: var(--rn-dim); font-size: 13px; }
  .reason { font-style: italic; }
  .last4 { font: 700 15px var(--rn-mono); color: var(--rn-accent-2); }
  #key { display: block; margin: 0 0 10px; }
  #error { color: var(--rn-danger); font-size: 13px; margin: 0 0 8px; }
  .row { display: flex; align-items: center; gap: 10px; }
  #left { flex: 1; font: 600 13px var(--rn-mono); color: var(--rn-dim); }
  kbd { font: 700 12px var(--rn-mono); padding: 1px 6px; border: 1px solid var(--rn-line); color: var(--rn-fg); }
</style>
</head>
<body>
  <rn-window title="A mod asks for your key" no-space>
    <p><b id="pkg">A mod</b> asks to use your <b id="svc">AI service</b> key.</p>
    <p class="reason dim" id="reason" hidden></p>
    <p id="what"></p>
    <rn-input id="key" type="password" placeholder="Paste the key, then Enter" hidden></rn-input>
    <p id="error" hidden></p>
    <div class="row">
      <span id="left">Press <kbd>F10</kbd> to use the mouse here.</span>
      <rn-button id="deny" variant="ghost">Deny</rn-button>
      <rn-button id="allow">Allow</rn-button>
    </div>
  </rn-window>
  <script src="app.js"></script>
</body>
</html>
