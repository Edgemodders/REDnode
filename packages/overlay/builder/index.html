<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>REDnode mod window</title>
<script src="rednode://ui/rednode-ui.js"></script>
<style>
  /* A window built by a Node mod with rednode's ui builder. The host sizes the
     page; space the window does not use stays transparent and clicks through. */
  html, body { margin: 0; overflow: hidden; background: transparent; }
  /* rn-window is a flex column: kept so, its body scrolls when the content is taller
     than the window (display: block clipped it; found in the C5 test with the Ask mod). */
  rn-window { width: 100%; max-height: 100vh; }
  rn-window[hidden] { display: none; }
  .content { display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .column { display: flex; flex-direction: column; gap: 8px; }
  .text { font-size: 15px; line-height: 1.4; color: var(--rn-fg); white-space: pre-wrap; }
  .heading { margin: 4px 0 0; font: 700 14px var(--rn-display); letter-spacing: .12em; text-transform: uppercase; color: var(--rn-accent); }
  .tone-dim { color: var(--rn-dim); }
  .tone-accent { color: var(--rn-accent); }
  .tone-danger { color: var(--rn-danger); }
  /* ui.list: scrolls on its own. Without a height it fills the window's free height, and
     the window takes the page's full height, so the window itself never scrolls. */
  .list { min-height: 60px; overflow-x: hidden; overflow-y: auto; padding: 4px 8px; font: 12px/1.5 var(--rn-mono);
    color: var(--rn-fg); background: color-mix(in srgb, var(--rn-panel-2) 55%, transparent); border: 1px solid var(--rn-line); }
  .list .line { white-space: pre-wrap; overflow-wrap: anywhere; }
  .list .line:nth-child(even) { background: color-mix(in srgb, var(--rn-panel-2) 45%, transparent); }
  body.fill rn-window { height: 100vh; }
  body.fill .content, body.fill .column:has(.list.fill), body.fill .content > .list.fill, body.fill .column > .list.fill { flex: 1; min-height: 0; }
</style>
</head>
<body>
  <rn-window id="win" draggable></rn-window>
<script src="builder.js"></script>
</body>
</html>
