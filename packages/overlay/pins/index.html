<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>World pins</title>
    <style>
      /* An atlas: REDnode draws parts of this page where each pin lands on the screen. Pieces sit
         at whole pixels with gaps, so a stretched or scaled piece never picks up its neighbour. */
      html,
      body {
        margin: 0;
        width: 1024px;
        height: 2048px;
        overflow: hidden;
        background: transparent;
        font-family: 'Rajdhani', 'Bahnschrift', 'Segoe UI', sans-serif;
      }
      .piece {
        position: absolute;
      }
      #post {
        left: 4px;
        top: 4px;
        width: 10px;
        height: 256px;
        background: linear-gradient(to top, var(--c) 0%, var(--c) 6%, color-mix(in srgb, var(--c) 70%, transparent) 30%, transparent 100%);
        border-radius: 5px 5px 2px 2px;
        box-shadow: 0 0 6px var(--c);
        --c: #19f3ff;
      }
      .arrow {
        width: 28px;
        height: 28px;
        color: #19f3ff;
        filter: drop-shadow(0 0 3px #000) drop-shadow(0 0 2px #19f3ff);
      }
      .arrow svg {
        width: 28px;
        height: 28px;
        display: block;
      }
      .label {
        box-sizing: border-box;
        min-width: 120px;
        max-width: 300px;
        padding: 5px 10px 6px;
        background: rgba(8, 10, 16, 0.82);
        border: 1px solid var(--c);
        border-left-width: 3px;
        border-radius: 2px;
        color: #e8f6ff;
        box-shadow: 0 0 8px color-mix(in srgb, var(--c) 45%, transparent);
        --c: #19f3ff;
      }
      .title {
        font-size: 18px;
        font-weight: 700;
        line-height: 1.15;
        color: var(--c);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .text {
        font-size: 14px;
        line-height: 1.2;
        margin-top: 2px;
        overflow-wrap: anywhere;
      }
      .distance {
        font-size: 13px;
        margin-top: 2px;
        color: #9fb6c8;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div id="post" class="piece"></div>
    <div id="arrow-left" class="piece arrow" style="left: 24px; top: 4px">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M16 3 6 12l10 9z" /></svg>
    </div>
    <div id="arrow-right" class="piece arrow" style="left: 60px; top: 4px">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="m8 3 10 9-10 9z" /></svg>
    </div>
    <div id="arrow-up" class="piece arrow" style="left: 96px; top: 4px">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="m3 16 9-10 9 10z" /></svg>
    </div>
    <div id="arrow-down" class="piece arrow" style="left: 132px; top: 4px">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="m3 8 9 10 9-10z" /></svg>
    </div>
    <div id="labels"></div>
    <script src="app.js"></script>
  </body>
</html>
