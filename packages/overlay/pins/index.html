<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>World pins</title>
    <style>
      /* An atlas: REDnode draws parts of this page where each pin lands on the screen. Pieces sit
         at whole pixels with gaps, so a stretched or scaled piece never picks up its neighbour.
         A post and four arrows per colour, then the labels (app.js). */
      html,
      body {
        margin: 0;
        width: 2048px;
        height: 2048px;
        overflow: hidden;
        background: transparent;
        font-family: 'Rajdhani', 'Bahnschrift', 'Segoe UI', sans-serif;
      }
      .piece {
        position: absolute;
      }
      .post {
        width: 10px;
        height: 128px;
        background: linear-gradient(to top, var(--c) 0%, var(--c) 6%, color-mix(in srgb, var(--c) 70%, transparent) 30%, transparent 100%);
        border-radius: 5px 5px 2px 2px;
        box-shadow: 0 0 6px var(--c);
      }
      .arrow {
        width: 28px;
        height: 28px;
        color: var(--c);
        filter: drop-shadow(0 0 3px #000) drop-shadow(0 0 2px var(--c));
      }
      .arrow svg {
        width: 28px;
        height: 28px;
        display: block;
      }
      .label {
        box-sizing: border-box;
        min-width: 120px;
        max-width: 300px;
        padding: 5px 10px 6px;
        background: rgba(8, 10, 16, 0.82);
        border: 1px solid var(--c);
        border-left-width: 3px;
        border-radius: 2px;
        color: #e8f6ff;
        box-shadow: 0 0 8px color-mix(in srgb, var(--c) 45%, transparent);
        --c: #19f3ff;
        --title: 18px;
        --text: 14px;
      }
      .title {
        font-size: var(--title);
        font-weight: 700;
        line-height: 1.15;
        color: var(--c);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .text {
        font-size: var(--text);
        line-height: 1.2;
        margin-top: 2px;
        overflow-wrap: anywhere;
      }
      .distance {
        font-size: calc(var(--text) - 1px);
        margin-top: 2px;
        color: #9fb6c8;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div id="pieces"></div>
    <div id="labels"></div>
    <script src="app.js"></script>
  </body>
</html>
