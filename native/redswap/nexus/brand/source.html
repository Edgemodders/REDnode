<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>REDswap brand</title>
<!-- The source of REDswap's brand images, in REDnode's style (as the app packs' images).
     tools/brand/render.cjs draws it at each size: #banner (2560 x 640), #social and #nexus
     (1280 x 640), #icon (256 x 256). -->
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Rajdhani:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #08090d; --panel: #10131b; --line: #262c3d; --fg: #e3e6ee; --dim: #8a93a8;
    --yellow: #fcee0a; --cyan: #19f3ff; --green: #5dffa1;
    --display: "Chakra Petch", sans-serif; --body: "Rajdhani", sans-serif; --mono: "JetBrains Mono", monospace; }
  html, body { margin: 0; overflow: hidden; background: var(--bg); }
  .art { position: relative; overflow: hidden; background:
      radial-gradient(ellipse at 0% 100%, rgba(252, 238, 10, .08), transparent 55%),
      linear-gradient(rgba(25, 243, 255, .045) 1px, transparent 1px) 0 0 / 40px 40px,
      linear-gradient(90deg, rgba(25, 243, 255, .045) 1px, transparent 1px) 0 0 / 40px 40px,
      var(--bg); }
  .corner { position: absolute; width: 58px; height: 58px; border: 0 solid var(--yellow); }
  .corner.tl { left: 32px; top: 32px; border-left-width: 3px; border-top-width: 3px; }
  .corner.br { right: 32px; bottom: 32px; border-right-width: 3px; border-bottom-width: 3px; }
  .kicker { font: 500 28px var(--mono); letter-spacing: .3em; text-transform: uppercase; color: var(--cyan); white-space: nowrap; }
  .title { font: 700 186px/0.9 var(--display); text-transform: uppercase; letter-spacing: .01em; color: var(--fg); white-space: nowrap; }
  .title b { color: var(--yellow); font-weight: 700; }
  .tag { font: 500 46px/1.25 var(--body); color: #c9cfdd; }
  .rule { height: 4px; background: var(--line); position: relative; }
  .rule::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 18%; background: var(--yellow); }
  .panel { background: var(--panel); border: 1px solid var(--line);
    clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 22px 100%, 0 calc(100% - 22px)); }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 40px; font: 500 22px var(--mono); letter-spacing: .14em; text-transform: uppercase; }
  .row span:first-child { color: var(--dim); }
  .row + .row { border-top: 2px solid var(--line); }
  .c { color: var(--cyan); } .y { color: var(--yellow); } .g { color: var(--green); }

  /* The swap: two versions of an archive, the old one fading, an arrow between. */
  .swap { position: absolute; display: flex; align-items: center; gap: 22px; }
  .file { border: 2px solid var(--line); background: var(--panel); padding: 10px 16px; font: 500 20px var(--mono);
    letter-spacing: .08em; color: var(--dim); white-space: nowrap;
    clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%); }
  .file.old { opacity: .5; text-decoration: line-through; text-decoration-color: rgba(255, 77, 109, .8); }
  .file.new { border-color: var(--cyan); color: var(--cyan); }
  .arrow { font: 700 40px var(--display); color: var(--yellow); }

  /* banner: 2560 x 640 */
  #banner { width: 2560px; height: 640px; }
  #banner .text { position: absolute; left: 112px; top: 96px; width: 1300px; }
  #banner .title { margin: 26px 0 30px; }
  #banner .tag { max-width: 1100px; }
  #banner .rule { margin-top: 44px; width: 1120px; }
  #banner .panel { position: absolute; right: 112px; top: 178px; width: 720px; padding: 22px 44px; }
  #banner .row { padding: 22px 0; }
  #banner .swap { right: 112px; bottom: 70px; width: 720px; justify-content: space-between; }

  /* social: 1280 x 640 */
  #social { width: 1280px; height: 640px; }
  #social .corner { width: 36px; height: 36px; left: 16px; top: 16px; }
  #social .corner.br { left: auto; top: auto; right: 16px; bottom: 16px; }
  #social .text { position: absolute; left: 80px; top: 92px; width: 1120px; }
  #social .kicker { font-size: 17px; }
  #social .title { font-size: 128px; margin: 22px 0 22px; }
  #social .tag { font-size: 30px; max-width: 700px; }
  #social .rule { margin-top: 26px; width: 560px; }
  #social .panel { position: absolute; left: 80px; right: 80px; top: 440px; display: flex; padding: 22px 22px; }
  #social .row { flex: 1; display: block; padding: 0; font-size: 15px; }
  #social .row + .row { border-top: 0; }
  #social .row span { display: block; }
  #social .row span + span { margin-top: 8px; }
  #social .swap { right: 80px; top: 250px; flex-direction: column; gap: 10px; align-items: flex-end; }
  #social .file { font-size: 16px; padding: 8px 14px; }
  #social .arrow { font-size: 30px; line-height: 1; }

  /* nexus: 1280 x 640, the social layout 55 px lower, leaving the top for the EDGEmodders
     header the owner adds by hand (after REDnode's own nexus.png) */
  #nexus { width: 1280px; height: 640px; }
  #nexus .corner { width: 36px; height: 36px; left: 16px; top: 16px; }
  #nexus .corner.br { left: auto; top: auto; right: 16px; bottom: 16px; }
  #nexus .text { position: absolute; left: 74px; top: 147px; width: 1120px; }
  #nexus .kicker { font-size: 17px; }
  #nexus .title { font-size: 128px; margin: 22px 0 22px; }
  #nexus .tag { font-size: 30px; max-width: 700px; }
  #nexus .rule { margin-top: 26px; width: 560px; }
  #nexus .panel { position: absolute; left: 74px; right: 86px; top: 495px; display: flex; padding: 22px 22px; }
  #nexus .row { flex: 1; display: block; padding: 0; font-size: 15px; }
  #nexus .row + .row { border-top: 0; }
  #nexus .row span { display: block; }
  #nexus .row span + span { margin-top: 8px; }
  #nexus .swap { right: 86px; top: 300px; flex-direction: column; gap: 10px; align-items: flex-end; }
  #nexus .file { font-size: 16px; padding: 8px 14px; }
  #nexus .arrow { font-size: 30px; line-height: 1; }

  /* icon: 256 x 256 */
  #icon { width: 256px; height: 256px; clip-path: polygon(0 0, 214px 0, 256px 42px, 256px 256px, 42px 256px, 0 214px); }
  #icon .corner { width: 26px; height: 26px; border-width: 0; }
  #icon .corner.tl { left: 20px; top: 20px; border-left-width: 5px; border-top-width: 5px; }
  #icon .corner.br { right: 20px; bottom: 20px; border-right-width: 5px; border-bottom-width: 5px; }
  #icon .title { position: absolute; left: 0; right: 0; top: 62px; text-align: center; font-size: 92px; }
  #icon .swap { left: 0; right: 0; bottom: 50px; justify-content: center; gap: 12px; }
  #icon .bar { width: 46px; height: 12px; background: var(--line); }
  #icon .bar.new { background: var(--cyan); }
  #icon .arrow { font-size: 30px; line-height: 1; }
</style>
</head>
<body>
<script>
  // Which image: ?kind=banner, social, nexus or icon (or the same as the URL's hash).
  const kind = new URLSearchParams(location.search).get('kind') || location.hash.slice(1) || 'banner';
  const rows = `
    <div class="row"><span>Swap</span><span class="c">In about 50 ms</span></div>
    <div class="row"><span>Refresh</span><span class="y">What V wears, preview too</span></div>
    <div class="row"><span>Game</span><span class="g">2.5, no restart</span></div>`;
  const swap = (row) => row
    ? '<div class="swap"><div class="file old">MyMod.archive · v1</div><div class="arrow">⇄</div><div class="file new">MyMod.archive · v2</div></div>'
    : '<div class="swap"><div class="file old">MyMod.archive · v1</div><div class="arrow">⇅</div><div class="file new">MyMod.archive · v2</div></div>';
  const text = (kicker) => `
    <div class="text">
      <div class="kicker">${kicker}</div>
      <div class="title">RED<b>swap</b></div>
      <div class="tag">Swap archives into the running game. See a new mesh, material or texture without a restart.</div>
      <div class="rule"></div>
    </div>`;
  const kicker = '// RED4ext plugin · Cyberpunk 2077 PC';
  const art = {
    banner: `${text(kicker)}<div class="panel">${rows}</div>${swap(true)}`,
    social: `${text(kicker)}<div class="panel">${rows}</div>${swap(false)}`,
    nexus: `${text(kicker)}<div class="panel">${rows}</div>${swap(false)}`,
    icon: '<div class="title">R<b>S</b></div><div class="swap"><div class="bar"></div><div class="arrow" style="color:var(--yellow)">⇄</div><div class="bar new"></div></div>',
  }[kind];
  document.body.innerHTML = `<div id="${kind}" class="art"><div class="corner tl"></div><div class="corner br"></div>${art}</div>`;
</script>
</body>
</html>
