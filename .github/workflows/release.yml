# Builds the REDnode player zip: the plugin, its scripts, the packaged overlay host and the
# samples, laid out like the game folder (tools/release/player-zip.mjs). The same zip goes to
# Nexus Mods (uploaded by hand) and to the GitHub release. Every app pack in packs/ (such as
# REDnode Sound Tools) is built too and attached to the release as its own file
# (tools/release/pack-zip.mjs); a pack with changes under Unreleased in its changelog stops
# the run until its version is raised.
#
#   Run workflow (Actions tab)                  builds the zip and keeps it as the run's artifact
#   Run workflow, "Make a release" ticked       also tags the commit v<VERSION> and makes the
#                                               GitHub release with the zip; stops first if that
#                                               tag exists (raise VERSION with tools/version.mjs)
#                                               or docs/changelog.md has no section for VERSION
#                                               (the release notes, tools/release/notes.mjs)
#   ... and "Update Nexus Mods" ticked          also, after the GitHub release, uploads the zip to
#                                               the Nexus page as the main file's new version (the
#                                               old one archived), adds its changelog and pushes
#                                               nexus/description.bbcode (tools/nexus/nexus.mjs,
#                                               the organization's NEXUS_KEY secret). It checks the
#                                               page first and stops before building if the
#                                               description changed on Nexus since the last pull
#                                               (npm run nexus:pull, commit, run again). If the
#                                               upload fails after the GitHub release, run
#                                               tools/nexus/nexus.mjs release on the dev PC with the
#                                               release's zip: it skips what is already done.
#                                               REDswap's own page (native/redswap/nexus, mod 36172)
#                                               gets the same: its zip as a new version when
#                                               native/redswap/redswap.json has a version not on
#                                               Nexus yet (else no upload), its changelog section,
#                                               and its description when it changed.
#                                               So does every app pack with a Nexus page
#                                               (packs/<id>/nexus/nexus.json: Sound Tools, 35537),
#                                               with the version in its pack.json.
#
# REDswap, the archive swap plugin, is in REDnode's zip and also gets its own zip
# (tools/release/redswap-zip.mjs), attached to the GitHub release. It has its own version and
# changelog (native/redswap/); changes under Unreleased there stop the run, as for a pack.
#
# Release gate: make a release only after every in-game test of the builds since the last
# release has passed (docs/testing.md). Untested or failed means no release.
name: Release zip

on:
  workflow_dispatch:
    inputs:
      release:
        description: Make a release (tags this commit v<VERSION>). Only after every in-game test has passed
        type: boolean
        default: false
      nexus:
        description: Update Nexus Mods (with Make a release) - upload the zip, its changelog and the page's description
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  zip:
    # VS 2022's toolset, as on the dev machine (docs/dev-setup.md): players' Visual C++ runtimes cover it.
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags: the Nexus check compares with the previous release's description

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: The version is not released yet
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          gh api "repos/${{ github.repository }}/git/ref/tags/v$version" --silent 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "::error::v$version is already released. Raise VERSION with node tools/version.mjs <version>."
            exit 1
          }
          $global:LASTEXITCODE = 0

      - name: Release notes from docs/changelog.md
        if: inputs.release
        run: |
          node tools/release/notes.mjs --out "$env:RUNNER_TEMP/notes.md"
          node tools/release/notes.mjs --nexus --out "$env:RUNNER_TEMP/nexus-notes.txt"
          $redswap = (Get-Content native/redswap/redswap.json -Raw | ConvertFrom-Json).version
          node tools/release/notes.mjs $redswap --nexus --changelog native/redswap/changelog.md --out "$env:RUNNER_TEMP/redswap-nexus-notes.txt"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Each app pack with a Nexus page (packs/<id>/nexus/nexus.json): its changelog section.
          foreach ($page in Get-ChildItem packs/*/nexus/nexus.json) {
            $id = $page.Directory.Parent.Name
            $pack = Get-Content "packs/$id/pack.json" -Raw | ConvertFrom-Json
            node tools/release/notes.mjs $pack.version --nexus --changelog "packs/$id/changelog.md" --out "$env:RUNNER_TEMP/$id-nexus-notes.txt"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - name: Nexus Mods can take this release
        if: inputs.release && inputs.nexus
        env:
          NEXUS_KEY: ${{ secrets.NEXUS_KEY }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          node tools/nexus/nexus.mjs check --version $version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $redswap = (Get-Content native/redswap/redswap.json -Raw | ConvertFrom-Json).version
          node tools/nexus/nexus.mjs check native/redswap/nexus --version $redswap
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($page in Get-ChildItem packs/*/nexus/nexus.json) {
            $id = $page.Directory.Parent.Name
            $pack = Get-Content "packs/$id/pack.json" -Raw | ConvertFrom-Json
            node tools/nexus/nexus.mjs check "packs/$id/nexus" --version $pack.version
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1 # the packager fetches its own Electron

      - name: Build the plugin and run its unit tests
        run: .\tools\build-native.ps1

      - name: Package the overlay host
        run: npm run overlay:package

      - name: Build the zip
        run: npm run release:zip

      - name: Build the app packs' zips
        run: npm run release:pack -- --all

      - name: Build REDswap's own zip
        run: npm run release:redswap

      - uses: actions/upload-artifact@v4
        with:
          name: REDnode-zip
          path: |
            native/build/release/REDnode-*.zip
            native/build/release/REDswap-*.zip
          if-no-files-found: error

      - name: GitHub release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          # @(...) keeps it a list: one pack would be a single string, which splatting splits into characters.
          $packs = @(Get-ChildItem native/build/release -Filter '*.zip' | Where-Object Name -ne "REDnode-$version.zip" | ForEach-Object FullName)
          gh release create "v$version" "native/build/release/REDnode-$version.zip" @packs --target $env:GITHUB_SHA --title "REDnode $version" --notes-file "$env:RUNNER_TEMP/notes.md" --generate-notes

      - name: Nexus Mods
        if: inputs.release && inputs.nexus
        env:
          NEXUS_KEY: ${{ secrets.NEXUS_KEY }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          node tools/nexus/nexus.mjs release --version $version --zip "native/build/release/REDnode-$version.zip" --notes "$env:RUNNER_TEMP/nexus-notes.txt"

      - name: Nexus Mods (REDswap)
        if: inputs.release && inputs.nexus
        env:
          NEXUS_KEY: ${{ secrets.NEXUS_KEY }}
        run: |
          $redswap = (Get-Content native/redswap/redswap.json -Raw | ConvertFrom-Json).version
          node tools/nexus/nexus.mjs release native/redswap/nexus --version $redswap --zip "native/build/release/REDswap-$redswap.zip" --notes "$env:RUNNER_TEMP/redswap-nexus-notes.txt"

      - name: Nexus Mods (app packs)
        if: inputs.release && inputs.nexus
        env:
          NEXUS_KEY: ${{ secrets.NEXUS_KEY }}
        run: |
          # Each app pack with a Nexus page (packs/<id>/nexus/nexus.json). A pack whose version is
          # already on Nexus gets no upload, only its description when that changed.
          foreach ($page in Get-ChildItem packs/*/nexus/nexus.json) {
            $id = $page.Directory.Parent.Name
            $pack = Get-Content "packs/$id/pack.json" -Raw | ConvertFrom-Json
            $zip = "native/build/release/$($pack.name -replace '\s+', '-')-$($pack.version).zip"
            node tools/nexus/nexus.mjs release "packs/$id/nexus" --version $pack.version --zip $zip --notes "$env:RUNNER_TEMP/$id-nexus-notes.txt"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
